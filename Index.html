<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Distribución de Voluntarios</title>
<style>
  :root{
    --maroon:#6e0f14; --maroon-2:#8a1a20; --gold:#f2c14e;
    --cream:#fff8f0; --card:#ffffff; --line:#f0dfc4;
    --ink:#1b1b1b; --muted:#7a7468; --red:#a3141c;
    --mint-bg:#d8f6e4; --mint-bd:#9fe0bb; --mint-tx:#0b6b3a;
    --blue-bg:#e6efff; --blue-tx:#2a4fb0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
  [hidden]{display:none!important}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:0 10px 40px rgba(110,15,20,.08)}
  .logo{width:54px;height:54px;border-radius:14px;background:var(--maroon);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:18px}
  .login-card h1{margin:0 0 6px;font-size:22px}
  .login-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.45}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fffdf9;outline:none;transition:.15s}
  input:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(110,15,20,.12)}
  .field{margin-bottom:16px}
  .btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--maroon);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:var(--maroon-2)}
  .btn:disabled{opacity:.6;cursor:wait}
  .err{color:var(--red);font-size:13.5px;min-height:20px;margin:0 0 12px}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

  /* ---------- App ---------- */
  header.top{background:var(--maroon);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  header.top .logo{margin:0;width:38px;height:38px;font-size:15px;background:#fff1;border:1px solid #ffffff30}
  header.top .who{flex:1;min-width:0}
  header.top .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top .who span{font-size:12px;opacity:.8}
  .btn-out{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
  .btn-out:hover{background:#ffffff1f}
  main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:130px}
  .stat b{display:block;font-size:24px;color:var(--maroon)}
  .stat span{font-size:12px;color:var(--muted)}
  .search{margin-bottom:16px}
  .search input{max-width:420px}

  .section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none}
  .row.static{cursor:default}
  .row:hover:not(.static){background:#fffaf3}
  .avatar{flex:none;width:46px;height:46px;border-radius:13px;background:var(--maroon);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:14px}
  .avatar.sm{width:40px;height:40px;font-size:13px;background:#8a1a20}
  .info{flex:1;min-width:0}
  .name{font-weight:800;font-size:17px;letter-spacing:.01em}
  .dni{font-size:12px;color:var(--muted);margin-left:8px}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .sub .red{color:var(--red);font-weight:700}
  .sub a{color:inherit}
  .chev{flex:none;width:22px;height:22px;transition:transform .2s;color:var(--maroon)}
  .card.open>.row .chev{transform:rotate(180deg)}
  .panel{display:none;border-top:1px solid var(--line);padding:6px 14px 16px;background:#fffdfa}
  .card.open>.panel{display:block}

  .guide-card{margin:10px 0 0;border-radius:14px;box-shadow:none}
  .guide-card .name{font-size:15.5px}

  .tablewrap{overflow-x:auto;margin-top:10px;border-radius:12px;background:#fbf4ea}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
  th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#6c7a89;padding:11px 14px;font-weight:700}
  td{padding:11px 14px;border-top:1px solid var(--line);background:#fff}
  td.n{font-weight:700}
  td.mono{white-space:nowrap}
  .code{display:inline-block;border:1px solid #e3d5bd;border-radius:7px;padding:2px 8px;font-size:12.5px;font-weight:700;background:#fff}
  .pill{display:inline-block;background:var(--mint-bg);border:1px solid var(--mint-bd);color:var(--mint-tx);font-weight:700;border-radius:999px;padding:3px 11px;font-size:12.5px}
  .muted{color:#b3ac9e}
  .empty{padding:16px;color:var(--muted);font-size:14px}
  .stat.c-green b{color:#12834a}.stat.c-yellow b{color:#b98400}.stat.c-red b{color:#c0262d}.stat.c-gray b{color:#6b6458}
  .stat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .estado{display:flex;align-items:center;gap:8px}
  .dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid #d6cbb6;background:#fff;transition:.15s}
  .dot.contactado{background:#22c55e;border-color:#16a34a}
  .dot.no_contesta{background:#facc15;border-color:#ca9a04}
  .dot.no_continua{background:#ef4444;border-color:#c62828}
  select.est{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fffdf9;color:var(--ink);cursor:pointer;min-width:140px}
  select.est:focus{outline:none;border-color:var(--maroon)}
  .net{font-size:12px;opacity:.85;white-space:nowrap}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3a0a0d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
  .leader-card>.row .avatar{background:var(--maroon)}
  .leader-card>.panel{padding:4px 14px 14px}
  @media(max-width:640px){
    .name{font-size:15px}.dni{display:block;margin:2px 0 0}
    .row{padding:12px}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo">DV</div>
    <h1>Distribución de voluntarios</h1>
    <p>Ingresa con tu DNI. Verás únicamente la información que te corresponde según tu rol.</p>
    <div class="field">
      <label for="dniIn">Usuario (DNI)</label>
      <input id="dniIn" type="text" inputmode="numeric" maxlength="8" placeholder="8 dígitos" required>
    </div>
    <div class="field">
      <label for="pwIn">Contraseña (DNI)</label>
      <input id="pwIn" type="password" inputmode="numeric" maxlength="8" placeholder="8 dígitos" required>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="btnLogin" type="submit">Ingresar</button>
    <div class="hint">🔒 Los datos están cifrados y solo se abren con tu DNI.</div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="logo" id="hLogo"></div>
    <div class="who"><b id="hName"></b><span id="hRole"></span></div>
    <span class="net" id="net"></span>
    <button class="btn-out" id="btnOut">Cerrar sesión</button>
  </header>
  <main id="content"></main>
</div>

const CFG = {"db": "https://distribucion-6ce1f-default-rtdb.firebaseio.com"};

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = u => [...u].map(b => b.toString(16).padStart(2, "0")).join("");
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const val = v => v ? esc(v) : '<span class="muted">—</span>';
  const fdate = d => { if(!d) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; };

  let failures = 0, idleTimer = null, data = null;

  /* ---------- Login ---------- */
  async function tryLogin(dni){
    const keyMat = await crypto.subtle.importKey("raw", enc.encode(dni), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name:"PBKDF2", hash:"SHA-256", salt:b64(VAULT.salt), iterations:VAULT.iter}, keyMat, 512));
    const id = hex(bits.slice(0, 32));
    const blob = VAULT.blobs[id];
    if(!blob) return null;
    const key = await crypto.subtle.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"]);
    try{
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
      return JSON.parse(dec.decode(pt));
    }catch(e){ return null; }
  }

  $("#loginForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const u = $("#dniIn").value.trim(), p = $("#pwIn").value.trim(), err = $("#err"), btn = $("#btnLogin");
    err.textContent = "";
    if(!/^\d{8}$/.test(u) || u !== p){
      err.textContent = "Usuario o contraseña incorrectos.";
      return;
    }
    btn.disabled = true; btn.textContent = "Verificando…";
    let res = null;
    try{ res = await tryLogin(u); }
    catch(e){ err.textContent = "Tu navegador no admite el cifrado necesario. Usa Chrome, Edge, Firefox o Safari actualizados."; btn.disabled=false; btn.textContent="Ingresar"; return; }
    if(res){
      failures = 0; $("#dniIn").value = ""; $("#pwIn").value = "";
      btn.disabled = false; btn.textContent = "Ingresar";
      showApp(res);
    }else{
      failures++;
      err.textContent = "Usuario o contraseña incorrectos.";
      const wait = Math.min(failures * 2, 20);
      for(let s = wait; s > 0; s--){ btn.textContent = `Espera ${s} s…`; await new Promise(r => setTimeout(r, 1000)); }
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  });

  /* ---------- Estados (Firebase Realtime Database vía REST + SSE) ---------- */
  const ESTADOS = {contactado:"Contactado", no_contesta:"No contesta", no_continua:"No continúa"};
  let estados = {}, es = null;
  const DB = CFG && CFG.db ? CFG.db.replace(/\/+$/, "") : null;
  const LS = "estados_v1";

  function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }
  function netStatus(txt){ $("#net").textContent = txt; }

  function applyState(){
    document.querySelectorAll("select.est").forEach(s => {
      const v = estados[s.dataset.vol] || "";
      if(document.activeElement !== s) s.value = v;
      s.previousElementSibling.className = "dot" + (v ? " " + v : "");
    });
    updateStats();
  }

  function connect(){
    if(!DB){
      try{ estados = JSON.parse(localStorage.getItem(LS) || "{}"); }catch(e){ estados = {}; }
      netStatus("Modo local"); applyState(); return;
    }
    netStatus("Conectando…");
    fetch(DB + "/estados.json").then(r => r.json()).then(d => { estados = d || {}; applyState(); }).catch(()=>{});
    es = new EventSource(DB + "/estados.json");
    es.addEventListener("open", () => netStatus("● En línea"));
    es.addEventListener("error", () => netStatus("○ Sin conexión"));
    es.addEventListener("put", e => {
      const m = JSON.parse(e.data);
      if(m.path === "/") estados = m.data || {};
      else{ const id = m.path.slice(1); if(m.data == null) delete estados[id]; else estados[id] = m.data; }
      applyState();
    });
    es.addEventListener("patch", e => {
      const m = JSON.parse(e.data);
      if(m.path === "/") for(const k in m.data){ if(m.data[k] == null) delete estados[k]; else estados[k] = m.data[k]; }
      applyState();
    });
  }
  function disconnect(){ if(es){ es.close(); es = null; } estados = {}; netStatus(""); }

  async function setEstado(id, v){
    const prev = estados[id];
    if(v) estados[id] = v; else delete estados[id];
    applyState();
    if(!DB){ try{ localStorage.setItem(LS, JSON.stringify(estados)); }catch(e){} return; }
    try{
      const r = await fetch(`${DB}/estados/${encodeURIComponent(id)}.json`, v ? {method:"PUT", body:JSON.stringify(v)} : {method:"DELETE"});
      if(!r.ok) throw new Error(r.status);
    }catch(e){
      if(prev) estados[id] = prev; else delete estados[id];
      applyState(); toast("No se pudo guardar el estado. Revisa tu conexión.");
    }
  }

  /* ---------- Vistas ---------- */
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

  function estadoCell(v){
    const cur = estados[v.codigo] || "";
    return `<div class="estado"><span class="dot${cur ? " " + cur : ""}"></span>
      <select class="est" data-vol="${esc(v.codigo)}" aria-label="Estado de ${esc(v.nombre)}">
        <option value=""${cur ? "" : " selected"}>— Sin estado —</option>
        ${Object.entries(ESTADOS).map(([k, l]) => `<option value="${k}"${cur === k ? " selected" : ""}>${l}</option>`).join("")}
      </select></div>`;
  }

  function volTable(vols){
    if(!vols.length) return '<div class="empty">Sin voluntarios asignados.</div>';
    return `<div class="tablewrap"><table>
      <thead><tr><th>Código</th><th>Nombre del voluntario</th><th>Teléfono</th><th>Correo</th><th>Edad</th><th>Estado</th></tr></thead>
      <tbody>${vols.map(v => `<tr>
        <td><span class="code mono">${esc(v.codigo)}</span></td>
        <td class="n">${val(v.nombre)}</td>
        <td class="mono">${val(v.telefono)}</td>
        <td>${v.correo ? `<a href="mailto:${esc(v.correo)}">${esc(v.correo)}</a>` : val("")}</td>
        <td>${val(v.edad)}</td>
        <td>${estadoCell(v)}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  function guideCard(g, open){
    return `<div class="card guide-card${open ? " open" : ""}" data-search="${esc((g.nombre + " " + g.codigo + " " + g.voluntarios.map(v => v.nombre).join(" ")).toLowerCase())}">
      <div class="row" data-toggle>
        <div class="avatar sm">${esc(g.codigo.slice(-3))}</div>
        <div class="info">
          <div><span class="name">${esc(g.nombre)}</span><span class="dni mono">DNI: ${esc(g.dni)}</span></div>
          <div class="sub"><span class="mono">${esc(g.codigo)}</span> · Tel. ${val(g.telefono)} · <span class="red">${g.voluntarios.length} voluntarios</span></div>
        </div>${chev}
      </div>
      <div class="panel">${volTable(g.voluntarios)}</div></div>`;
  }

  function leaderCard(l, guias){
    const nv = guias.reduce((a, g) => a + g.voluntarios.length, 0);
    return `<div class="card leader-card" data-lname="${esc(l.nombre.toLowerCase() + " " + l.codigo.toLowerCase())}">
      <div class="row" data-toggle>
        <div class="avatar">${esc(l.codigo)}</div>
        <div class="info">
          <div><span class="name">${esc(l.nombre)}</span><span class="dni mono">DNI: ${esc(l.dni)}</span></div>
          <div class="sub">Tel. ${val(l.telefono)} · ${guias.length} guías · <span class="red">${nv} voluntarios</span></div>
        </div>${chev}
      </div>
      <div class="panel">${guias.map(g => guideCard(g, false)).join("")}</div></div>`;
  }

  function personCard(p, label){
    return `<div class="card"><div class="row static">
      <div class="avatar">${esc(p.codigo)}</div>
      <div class="info">
        <div><span class="name">${esc(p.nombre)}</span>${p.dni ? `<span class="dni mono">DNI: ${esc(p.dni)}</span>` : ""}</div>
        <div class="sub">${label} · Tel. ${val(p.telefono)}</div>
      </div></div></div>`;
  }

  let visibleVols = [];
  function statsHtml(extra){
    return `<div class="stats">${extra}
      <div class="stat"><b id="s-vol">0</b><span>Voluntarios</span></div>
      <div class="stat c-green"><b id="s-con">0</b><span><i class="dot contactado" style="display:inline-block;width:9px;height:9px;margin-right:6px"></i>Contactados</span></div>
      <div class="stat c-yellow"><b id="s-nc">0</b><span><i class="dot no_contesta" style="display:inline-block;width:9px;height:9px;margin-right:6px"></i>No contestan</span></div>
      <div class="stat c-red"><b id="s-ncon">0</b><span><i class="dot no_continua" style="display:inline-block;width:9px;height:9px;margin-right:6px"></i>No continúan</span></div>
      <div class="stat c-gray"><b id="s-pen">0</b><span><i class="dot" style="display:inline-block;width:9px;height:9px;margin-right:6px"></i>Pendientes por contactar</span></div></div>`;
  }
  function updateStats(){
    if(!$("#s-vol")) return;
    const c = {contactado:0, no_contesta:0, no_continua:0};
    visibleVols.forEach(id => { if(c[estados[id]] !== undefined) c[estados[id]]++; });
    $("#s-vol").textContent = visibleVols.length;
    $("#s-con").textContent = c.contactado;
    $("#s-nc").textContent = c.no_contesta;
    $("#s-ncon").textContent = c.no_continua;
    $("#s-pen").textContent = visibleVols.length - c.contactado - c.no_contesta - c.no_continua;
  }

  function showApp(d){
    data = d;
    const role = d.role;
    const resp = d.responsable;
    const allGuias = role === "responsable" ? d.lideres.flatMap(x => x.guias) : d.guias;
    visibleVols = allGuias.flatMap(g => g.voluntarios.map(v => v.codigo));
    const me = role === "responsable" ? resp : role === "leader" ? d.lider : d.guias[0];
    $("#hLogo").textContent = role === "responsable" ? resp.codigo : role === "leader" ? d.lider.codigo : d.guias[0].codigo.slice(-3);
    $("#hName").textContent = me.nombre;
    $("#hRole").textContent = role === "responsable" ? "Responsable" : role === "leader" ? "Líder" : "Guía";

    let html = "";
    if(role === "responsable"){
      html += statsHtml(`<div class="stat"><b>${d.lideres.length}</b><span>Líderes</span></div><div class="stat"><b>${allGuias.length}</b><span>Guías / Cuadrillas</span></div>`);
      html += `<div class="search"><input id="q" type="text" placeholder="Buscar líder, guía o voluntario…"></div>`;
      html += `<div class="section-title">Líderes</div><div id="list">${d.lideres.map(x => leaderCard(x.lider, x.guias)).join("")}</div><div class="empty" id="none" hidden>Sin resultados.</div>`;
    }else if(role === "leader"){
      html += `<div class="section-title">Mi responsable</div>${personCard(resp, "Responsable")}`;
      html += statsHtml(`<div class="stat"><b>${d.guias.length}</b><span>Guías / Cuadrillas</span></div>`);
      html += `<div class="search"><input id="q" type="text" placeholder="Buscar guía o voluntario…"></div>`;
      html += `<div class="section-title">Mis guías</div><div id="list">${d.guias.map(g => guideCard(g, false)).join("")}</div><div class="empty" id="none" hidden>Sin resultados.</div>`;
    }else{
      html += `<div class="section-title">Mi responsable</div>${personCard(resp, "Responsable")}`;
      html += `<div class="section-title">Mi líder</div>${personCard(d.lider, "Líder")}`;
      html += `<div class="section-title">Mis voluntarios</div>` + statsHtml("") + `<div id="list">${d.guias.map(g => guideCard(g, true)).join("")}</div>`;
    }
    $("#content").innerHTML = html;
    $("#login").hidden = true; $("#app").hidden = false;
    window.scrollTo(0, 0);
    connect(); updateStats();
    resetIdle();
  }

  /* Acordeón, estados y búsqueda (delegación de eventos) */
  $("#content").addEventListener("click", ev => {
    const t = ev.target.closest("[data-toggle]");
    if(t) t.parentElement.classList.toggle("open");
  });
  $("#content").addEventListener("change", ev => {
    if(ev.target.matches("select.est")) setEstado(ev.target.dataset.vol, ev.target.value);
  });
  $("#content").addEventListener("input", ev => {
    if(ev.target.id !== "q") return;
    const q = ev.target.value.trim().toLowerCase();
    let shown = 0;
    const lcards = document.querySelectorAll("#list .leader-card");
    const filterGuides = (scope, all) => {
      let n = 0;
      scope.querySelectorAll(".guide-card").forEach(c => {
        const hit = !q || all || c.dataset.search.includes(q);
        c.hidden = !hit; if(hit) n++;
        if(q && hit && !all) c.classList.add("open"); else if(!q) c.classList.remove("open");
      });
      return n;
    };
    if(lcards.length){
      lcards.forEach(l => {
        const own = !q || l.dataset.lname.includes(q);
        const n = filterGuides(l, own);
        const hit = own || n > 0;
        l.hidden = !hit; if(hit) shown++;
        if(q && hit) l.classList.add("open"); else if(!q) l.classList.remove("open");
      });
    }else shown = filterGuides(document, false);
    $("#none").hidden = shown > 0;
  });

  /* ---------- Cierre de sesión ---------- */
  function logout(msg){
    data = null; clearTimeout(idleTimer); disconnect(); visibleVols = [];
    $("#content").innerHTML = ""; $("#hName").textContent = "";
    $("#app").hidden = true; $("#login").hidden = false;
    $("#err").textContent = msg || "";
    $("#dniIn").focus();
  }
  $("#btnOut").addEventListener("click", () => logout());
  function resetIdle(){
    clearTimeout(idleTimer);
    if(data) idleTimer = setTimeout(() => logout("Sesión cerrada por inactividad."), 10 * 60 * 1000);
  }
  ["click","keydown","mousemove","touchstart","scroll"].forEach(e => document.addEventListener(e, resetIdle, {passive:true}));
})();
</script>
</body>
</html>
